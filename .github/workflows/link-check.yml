name: Link Check

on:
  schedule:
    # Run weekly on Mondays at 06:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  link-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Link Checker
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --timeout 30
            --max-retries 3
            --retry-wait-time 5
            --exclude-mail
            --exclude 'clawhub\.ai'
            --exclude 'clawskills\.sh'
            --exclude 'img\.shields\.io'
            --exclude 'cdn\.voltagent\.dev'
            --exclude 'user-attachments/assets'
            --exclude 's\.voltagent\.dev'
            README.md
            categories/*.md
            burgess/**/*.md
          fail: false

      - name: Create issue on failure
        if: steps.lychee.outputs.exit_code != 0
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body = 'The weekly link check found broken links.\n\n';
            try {
              const report = fs.readFileSync('./lychee/out.md', 'utf8');
              body += report;
            } catch {
              body += 'See the [workflow run](' +
                `https://github.com/${context.repo.owner}/${context.repo.repo}` +
                `/actions/runs/${context.runId}) for details.`;
            }

            // Check for existing open issue to avoid duplicates
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'broken-link',
              state: 'open',
              per_page: 1
            });

            if (existing.data.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: '🔗 Weekly link check found broken links',
                body: body,
                labels: ['broken-link']
              });
            }
